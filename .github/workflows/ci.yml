name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: agent-relay
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests (SQLite)
        run: uv run pytest test_agent_relay.py -v

      - name: Start API server (PostgreSQL)
        env:
          RELAY_DATABASE_URL: postgresql://relay:relay@postgres:5432/agent_relay
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > uvicorn.pid
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API server is ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests (PostgreSQL)
        env:
          BASE_URL: http://localhost:8000
        run: uv run pytest test_integration_scenario_1.py -v

      - name: Stop API server
        if: always()
        run: kill $(cat uvicorn.pid) 2>/dev/null || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Also tag as latest
        run: docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/kubectl

      - name: Create kind cluster
        run: |
          kind delete cluster --name agent-relay 2>/dev/null || true
          kind create cluster --name agent-relay --wait 120s

      - name: Load image into kind
        run: kind load docker-image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --name agent-relay

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/
          # Update the image tag in the deployment
          kubectl set image deployment/agent-relay-api api=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n agent-relay
          # Update imagePullPolicy to Never since image is loaded locally
          kubectl patch deployment agent-relay-api -n agent-relay -p '{"spec":{"template":{"spec":{"containers":[{"name":"api","imagePullPolicy":"Never"}]}}}}'

      - name: Wait for rollout
        run: kubectl rollout status deployment/agent-relay-api -n agent-relay --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n agent-relay
          kubectl get deployments -n agent-relay
          kubectl get services -n agent-relay
