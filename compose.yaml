version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-relay-db
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: agent_relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agent-relay-api
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_URL: postgresql://relay:relay@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
